apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgress-rag
  labels:
    app: postgress-rag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgress-rag
  template:
    metadata:
      labels:
        app: postgress-rag
    spec:
      containers:
        - name: postgress-rag
          image: replace
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"

---
apiVersion: v1
kind: Service
metadata:
  name: postgress-rag-service
  labels:
    app: postgress-rag
spec:
  selector:
    app: postgress-rag
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer


